<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Isi Data Profil</title>
    <link rel="stylesheet" href="css/bootstrap-grid.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <nav class="navbar">
        <div class="container">
            <a href="index.html" class="navbar-brand">REHAN.ID</a>
            <ul class="navbar-nav">
                <li><a href="index.html">Home</a></li>
                <li><a href="profil.html">Isi Profil</a></li>
                <li><a href="profil-tampil.html">Lihat Profil</a></li>
            </ul>
        </div>
    </nav>

    <div class="container" style="max-width: 600px; margin-top: 50px;">
        <div class="card">
            <h2 style="margin-top: 0; border-bottom: 1px solid #334155; padding-bottom: 15px;">Formulir Data Profil</h2>
            <form id="profileForm">
                <div class="form-group">
                    <label for="nama">Nama Lengkap</label>
                    <input type="text" id="nama" class="form-control" required placeholder="Masukkan nama lengkap">
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" class="form-control" required placeholder="nama@email.com">
                </div>
                <div class="form-group">
                    <label for="keahlian">Keahlian Utama</label>
                    <input type="text" id="keahlian" class="form-control" required placeholder="Contoh: UI/UX Designer, Web Developer">
                </div>
                <div class="form-group">
                    <label for="bio">Biografi Singkat</label>
                    <textarea id="bio" class="form-control" rows="4" required placeholder="Ceritakan latar belakang singkat Anda..."></textarea>
                </div>
                <button type="submit" class="btn-custom" style="width: 100%;">Simpan dan Tampilkan Profil</button>
            </form>
        </div>
    </div>

    <script src="javascript/js.js"></script>
</body>
</html>
